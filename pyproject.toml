[project]
name = "instacampaign"
version = "0.1.0"
description = "Synthetic disclosed-AI persona pipeline: ComfyUI generation, QC, approval-gated Instagram publishing"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
# Face-consistency QC: InsightFace/ArcFace embeddings vs persona reference
# sheet. Without this extra the face gate returns needs_manual (fail-closed).
face = ["insightface>=0.7", "onnxruntime>=1.17"]
# SFW classifier QC gate. Without this extra the sfw gate returns
# needs_manual (fail-closed).
nsfw = ["opennsfw2>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instacampaign"]
